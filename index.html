<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Race Star - Circuit Manager</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0c0e13;
    color: white;
    font-family: Arial, sans-serif;
}


/* HEADER */

header {
    height: 64px;
    background: #171a22;
    border-bottom: 1px solid #30343e;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px;

    position: sticky;
    top: 0;

    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #ff3030;
}

.header-buttons {
    display: flex;
    gap: 7px;
}

.header-button {
    border: none;
    background: #30343f;
    color: white;

    padding: 9px 12px;

    border-radius: 8px;

    font-weight: bold;
}

.header-button.red {
    background: #ff3030;
}


/* NAV */

.nav {
    display: flex;

    background: #20232c;

    border-bottom: 1px solid #30343e;

    overflow-x: auto;
}

.nav button {
    flex: 1;

    min-width: 130px;

    padding: 13px;

    background: transparent;

    color: #aeb3bf;

    border: none;

    font-weight: bold;
}

.nav button.active {
    color: white;
    background: #2b2f3a;
}


/* PAGE */

.page {
    padding: 15px;

    max-width: 900px;

    margin: auto;
}


/* EDITOR */

.editor {
    position: relative;

    width: 100%;

    height: 55vh;

    min-height: 350px;

    background:
        linear-gradient(#20242d 1px, transparent 1px),
        linear-gradient(90deg, #20242d 1px, transparent 1px);

    background-size: 30px 30px;

    border-radius: 14px;

    overflow: hidden;

    border: 1px solid #30343e;
}

canvas {
    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}


/* TOOLBAR */

.toolbar {
    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding: 10px 0;
}

.tool {
    background: #292d37;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 10px 13px;

    white-space: nowrap;

    font-weight: bold;
}

.tool.active {
    background: #ff3030;
}


/* INFO */

.editor-info {
    position: absolute;

    left: 12px;
    top: 12px;

    background: rgba(10,12,17,.9);

    border-radius: 9px;

    padding: 10px;

    font-size: 12px;

    pointer-events: none;
}

.editor-info strong {
    color: #ff4040;
}


/* CIRCUITS */

.section-title {
    margin-top: 25px;

    margin-bottom: 10px;

    font-size: 20px;
}


.track-list {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 12px;
}


.track-card {
    background: #181b23;

    border: 1px solid #30343e;

    border-radius: 12px;

    padding: 15px;
}


.track-card h3 {
    margin-bottom: 7px;
}


.track-card p {
    color: #aeb3bf;

    font-size: 13px;

    margin-bottom: 4px;
}


.track-actions {
    display: flex;

    gap: 7px;

    margin-top: 12px;
}


.track-actions button {
    flex: 1;

    border: none;

    border-radius: 7px;

    padding: 9px;

    color: white;

    font-weight: bold;

    background: #30343f;
}


.track-actions .open {
    background: #ff3030;
}


.track-actions .delete {
    background: #52272a;
}


/* EMPTY */

.empty {
    background: #181b23;

    border: 1px dashed #3a3f4a;

    border-radius: 12px;

    padding: 25px;

    text-align: center;

    color: #8e94a1;
}


/* SAVE PANEL */

.overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.7);

    z-index: 90;
}


.modal {
    display: none;

    position: fixed;

    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: calc(100% - 30px);

    max-width: 420px;

    background: #191c24;

    border: 1px solid #363b47;

    border-radius: 15px;

    padding: 20px;
}


.modal h2 {
    margin-bottom: 15px;
}


.input {
    width: 100%;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 8px;

    border: 1px solid #363b47;

    background: #0e1015;

    color: white;

    outline: none;
}


.modal-buttons {
    display: flex;

    gap: 8px;

    margin-top: 5px;
}


.modal-buttons button {
    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 8px;

    font-weight: bold;
}


.cancel {
    background: #30343f;

    color: white;
}


.confirm {
    background: #ff3030;

    color: white;
}


/* STATUS */

.status {
    position: fixed;

    bottom: 18px;

    left: 50%;

    transform: translateX(-50%);

    background: #20242d;

    border: 1px solid #3a3f4a;

    padding: 10px 15px;

    border-radius: 20px;

    display: none;

    z-index: 200;

    font-size: 13px;
}


/* MOBILE */

@media(max-width:600px) {

    .editor {
        height: 50vh;
    }

    .track-list {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        🏎️ Race <span>Star</span>
    </div>

    <div class="header-buttons">

        <button
            class="header-button"
            onclick="newCircuit()">

            ＋ Nieuw

        </button>

        <button
            class="header-button red"
            onclick="openSave()">

            💾 Opslaan

        </button>

    </div>

</header>


<div class="nav">

    <button
        id="editorTab"
        class="active"
        onclick="showEditor()">

        🛠️ Editor

    </button>

    <button
        id="tracksTab"
        onclick="showTracks()">

        🏁 Mijn circuits

    </button>

</div>


<main class="page">


<!-- EDITOR -->

<section id="editorPage">

    <div class="toolbar">

        <button
            id="drawTool"
            class="tool active"
            onclick="setMode('draw')">

            ✏️ Tekenen

        </button>


        <button
            id="startTool"
            class="tool"
            onclick="setMode('start')">

            🏁 Start

        </button>


        <button
            id="pitTool"
            class="tool"
            onclick="setMode('pit')">

            🔧 Pit

        </button>


        <button
            class="tool"
            onclick="undoLast()">

            ↩️ Ongedaan

        </button>


        <button
            class="tool"
            onclick="clearTrack()">

            🗑 Wissen

        </button>

    </div>


    <div class="editor">

        <canvas id="canvas"></canvas>

        <div class="editor-info">

            <strong>CIRCUIT EDITOR</strong><br>

            Teken je eigen racebaan.

        </div>

    </div>


    <h2 class="section-title">
        📋 Mijn circuits
    </h2>


    <div id="trackList"></div>

</section>


<!-- CIRCUITS -->

<section
    id="tracksPage"
    style="display:none;">

    <h2 class="section-title">
        🏁 Opgeslagen circuits
    </h2>

    <div id="allTracks"></div>

</section>


</main>


<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeSave()">
</div>


<!-- SAVE MODAL -->

<div
    class="modal"
    id="modal">

    <h2>
        🏁 Circuit opslaan
    </h2>


    <input
        id="trackName"
        class="input"
        placeholder="Circuitnaam"
    >


    <input
        id="trackCity"
        class="input"
        placeholder="Stad"
    >


    <input
        id="trackCountry"
        class="input"
        placeholder="Land"
    >


    <div class="modal-buttons">

        <button
            class="cancel"
            onclick="closeSave()">

            Annuleren

        </button>


        <button
            class="confirm"
            onclick="saveTrack()">

            Opslaan

        </button>

    </div>

</div>


<div
    class="status"
    id="status">
</div>


<script>


/* ==============================
   VARIABLES
============================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let mode = "draw";

let drawing = false;

let trackPoints = [];

let startPoint = null;

let pitPoint = null;

let currentTrackId = null;


/* ==============================
   CANVAS
============================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    redraw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==============================
   POSITION
============================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    let x;
    let y;


    if (event.touches) {

        x =
            event.touches[0].clientX
            - rect.left;

        y =
            event.touches[0].clientY
            - rect.top;

    } else {

        x =
            event.clientX
            - rect.left;

        y =
            event.clientY
            - rect.top;

    }


    return {
        x,
        y
    };
}


/* ==============================
   DRAW START
============================== */

function startDrawing(event) {

    event.preventDefault();


    const pos =
        getPosition(event);


    if (mode === "draw") {

        drawing = true;

        trackPoints = [];

        trackPoints.push(pos);

        redraw();

        return;
    }


    if (mode === "start") {

        startPoint = pos;

        redraw();

        showStatus(
            "🏁 Start geplaatst"
        );

        return;
    }


    if (mode === "pit") {

        pitPoint = pos;

        redraw();

        showStatus(
            "🔧 Pitstraat geplaatst"
        );

        return;
    }

}


/* ==============================
   DRAW
============================== */

function draw(event) {

    if (!drawing) return;

    if (mode !== "draw") return;


    event.preventDefault();


    const pos =
        getPosition(event);


    const last =
        trackPoints[
            trackPoints.length - 1
        ];


    if (!last) {

        trackPoints.push(pos);

        return;
    }


    const distance =
        Math.sqrt(

            Math.pow(
                pos.x - last.x,
                2
            )

            +

            Math.pow(
                pos.y - last.y,
                2
            )

        );


    if (distance > 5) {

        trackPoints.push(pos);

        redraw();

    }

}


/* ==============================
   STOP
============================== */

function stopDrawing() {

    drawing = false;

}


/* ==============================
   REDRAW
============================== */

function redraw() {

    const rect =
        canvas.getBoundingClientRect();


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if (trackPoints.length > 1) {

        drawTrack(
            "#07090d",
            38
        );


        drawTrack(
            "#555a64",
            30
        );


        ctx.beginPath();


        ctx.moveTo(
            trackPoints[0].x,
            trackPoints[0].y
        );


        for (
            let i = 1;
            i < trackPoints.length;
            i++
        ) {

            ctx.lineTo(
                trackPoints[i].x,
                trackPoints[i].y
            );

        }


        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 2;

        ctx.setLineDash([
            8,
            8
        ]);

        ctx.lineCap =
            "round";

        ctx.stroke();

        ctx.setLineDash([]);

    }


    if (startPoint) {

        drawMarker(
            startPoint,
            "#22c55e",
            "🏁"
        );

    }


    if (pitPoint) {

        drawMarker(
            pitPoint,
            "#3b82f6",
            "🔧"
        );

    }

}


/* ==============================
   TRACK
============================== */

function drawTrack(
    color,
    width
) {

    ctx.beginPath();


    ctx.moveTo(
        trackPoints[0].x,
        trackPoints[0].y
    );


    for (
        let i = 1;
        i < trackPoints.length;
        i++
    ) {

        ctx.lineTo(
            trackPoints[i].x,
            trackPoints[i].y
        );

    }


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.stroke();

}


/* ==============================
   MARKER
============================== */

function drawMarker(
    point,
    color,
    emoji
) {

    ctx.beginPath();


    ctx.arc(
        point.x,
        point.y,
        17,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;

    ctx.fill();


    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 13px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        emoji,
        point.x,
        point.y
    );

}


/* ==============================
   MODE
============================== */

function setMode(newMode) {

    mode =
        newMode;


    document
        .querySelectorAll(".tool")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    if (newMode === "draw") {

        document
            .getElementById(
                "drawTool"
            )
            .classList.add(
                "active"
            );

    }


    if (newMode === "start") {

        document
            .getElementById(
                "startTool"
            )
            .classList.add(
                "active"
            );

    }


    if (newMode === "pit") {

        document
            .getElementById(
                "pitTool"
            )
            .classList.add(
                "active"
            );

    }

}


/* ==============================
   UNDO
============================== */

function undoLast() {

    if (
        trackPoints.length === 0
    ) {

        showStatus(
            "Niets om ongedaan te maken."
        );

        return;
    }


    trackPoints.pop();

    redraw();

}


/* ==============================
   CLEAR
============================== */

function clearTrack() {

    trackPoints = [];

    startPoint = null;

    pitPoint = null;

    currentTrackId = null;

    redraw();

    showStatus(
        "Circuit gewist."
    );

}


/* ==============================
   NEW CIRCUIT
============================== */

function newCircuit() {

    clearTrack();

    showEditor();

    showStatus(
        "Nieuw circuit gestart."
    );

}


/* ==============================
   SAVE
============================== */

function openSave() {

    if (
        trackPoints.length < 5
    ) {

        showStatus(
            "Teken eerst een circuit."
        );

        return;
    }


    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "modal"
        )
        .style.display =
        "block";

}


function closeSave() {

    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "modal"
        )
        .style.display =
        "none";

}


/* ==============================
   SAVE TRACK
============================== */

function saveTrack() {

    const name =
        document
            .getElementById(
                "trackName"
            )
            .value
            .trim();


    const city =
        document
            .getElementById(
                "trackCity"
            )
            .value
            .trim();


    const country =
        document
            .getElementById(
                "trackCountry"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Vul een circuitnaam in."
        );

        return;
    }


    let tracks =
        getTracks();


    const track = {

        id:
            currentTrackId ||
            Date.now(),

        name:
            name,

        city:
            city,

        country:
            country,

        points:
            trackPoints,

        start:
            startPoint,

        pit:
            pitPoint

    };


    if (currentTrackId) {

        const index =
            tracks.findIndex(
                track =>
                    track.id ===
                    currentTrackId
            );


        if (index !== -1) {

            tracks[index] =
                track;

        }

    } else {

        tracks.push(track);

    }


    localStorage.setItem(
        "raceStarTracks",
        JSON.stringify(tracks)
    );


    currentTrackId =
        track.id;


    closeSave();

    renderTracks();

    showStatus(
        "✅ Circuit opgeslagen!"
    );

}


/* ==============================
   GET TRACKS
============================== */

function getTracks() {

    return JSON.parse(
        localStorage.getItem(
            "raceStarTracks"
        )
    ) || [];

}


/* ==============================
   RENDER TRACKS
============================== */

function renderTracks() {

    const tracks =
        getTracks();


    const list =
        document.getElementById(
            "trackList"
        );


    const all =
        document.getElementById(
            "allTracks"
        );


    if (
        tracks.length === 0
    ) {

        const empty = `
            <div class="empty">
                🏁 Je hebt nog geen circuits.
                <br><br>
                Maak hierboven je eerste circuit.
            </div>
        `;


        list.innerHTML =
            empty;

        all.innerHTML =
            empty;

        return;
    }


    const html =
        tracks.map(
            track => `

            <div class="track-card">

                <h3>
                    🏁 ${escapeHTML(track.name)}
                </h3>

                <p>
                    📍 ${escapeHTML(track.city || "Onbekend")}
                </p>

                <p>
                    🌍 ${escapeHTML(track.country || "Onbekend")}
                </p>

                <p>
                    📐 ${track.points.length} baanpunten
                </p>

                <div class="track-actions">

                    <button
                        class="open"
                        onclick="openTrack(${track.id})">

                        Openen

                    </button>

                    <button
                        class="delete"
                        onclick="deleteTrack(${track.id})">

                        Verwijderen

                    </button>

                </div>

            </div>

        `
        ).join("");


    list.innerHTML =
        html;

    all.innerHTML =
        html;

}


/* ==============================
   OPEN TRACK
============================== */

function openTrack(id) {

    const tracks =
        getTracks();


    const track =
        tracks.find(
            track =>
                track.id === id
        );


    if (!track) return;


    trackPoints =
        track.points || [];


    startPoint =
        track.start || null;


    pitPoint =
        track.pit || null;


    currentTrackId =
        track.id;


    document
        .getElementById(
            "trackName"
        )
        .value =
        track.name || "";


    document
        .getElementById(
            "trackCity"
        )
        .value =
        track.city || "";


    document
        .getElementById(
            "trackCountry"
        )
        .value =
        track.country || "";


    showEditor();


    setTimeout(
        redraw,
        50
    );


    showStatus(
        "🏁 Circuit geopend."
    );

}


/* ==============================
   DELETE
============================== */

function deleteTrack(id) {

    const confirmed =
        confirm(
            "Weet je zeker dat je dit circuit wilt verwijderen?"
        );


    if (!confirmed) return;


    let tracks =
        getTracks();


    tracks =
        tracks.filter(
            track =>
                track.id !== id
        );


    localStorage.setItem(
        "raceStarTracks",
        JSON.stringify(tracks)
    );


    if (
        currentTrackId === id
    ) {

        currentTrackId =
            null;

        clearTrack();

    }


    renderTracks();

    showStatus(
        "🗑 Circuit verwijderd."
    );

}


/* ==============================
   TABS
============================== */

function showEditor() {

    document
        .getElementById(
            "editorPage"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tracksPage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "editorTab"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "tracksTab"
        )
        .classList.remove(
            "active"
        );


    setTimeout(
        resizeCanvas,
        50
    );

}


function showTracks() {

    document
        .getElementById(
            "editorPage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "tracksPage"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tracksTab"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "editorTab"
        )
        .classList.remove(
            "active"
        );


    renderTracks();

}


/* ==============================
   STATUS
============================== */

function showStatus(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.style.display =
        "block";


    setTimeout(
        () => {

            status.style.display =
                "none";

        },
        2000
    );

}


/* ==============================
   SECURITY
============================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ==============================
   TOUCH
============================== */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    draw,
    { passive: false }
);


canvas.addEventListener(
    "touchend",
    stopDrawing
);


/* ==============================
   MOUSE
============================== */

canvas.addEventListener(
    "mousedown",
    startDrawing
);


canvas.addEventListener(
    "mousemove",
    draw
);


canvas.addEventListener(
    "mouseup",
    stopDrawing
);


canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* ==============================
   START
============================== */

resizeCanvas();

renderTracks();

</script>

</body>
</html>
