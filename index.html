<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Race Star - Circuit Builder</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0d12;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================
   HEADER
========================= */

header {
    height: 64px;

    background: #171a22;

    border-bottom: 1px solid #30343f;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px;

    position: sticky;
    top: 0;

    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #ff3030;
}

.header-buttons {
    display: flex;
    gap: 7px;
}

.header-button {
    border: none;

    background: #30343f;

    color: white;

    padding: 9px 12px;

    border-radius: 8px;

    font-weight: bold;
}

.header-button.red {
    background: #ff3030;
}


/* =========================
   NAV
========================= */

.nav {
    display: flex;

    background: #20232c;

    border-bottom: 1px solid #30343f;

    overflow-x: auto;
}

.nav button {
    flex: 1;

    min-width: 140px;

    padding: 13px;

    border: none;

    background: transparent;

    color: #9fa5b3;

    font-weight: bold;
}

.nav button.active {
    background: #2a2e39;

    color: white;
}


/* =========================
   PAGE
========================= */

.page {
    max-width: 1000px;

    margin: auto;

    padding: 15px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;

    gap: 7px;

    overflow-x: auto;

    padding-bottom: 10px;
}

.tool {
    border: none;

    background: #292d37;

    color: white;

    padding: 10px 13px;

    border-radius: 8px;

    font-weight: bold;

    white-space: nowrap;
}

.tool.active {
    background: #ff3030;
}


/* =========================
   EDITOR
========================= */

.editor {
    position: relative;

    width: 100%;

    height: 58vh;

    min-height: 360px;

    background:
        linear-gradient(#1c2028 1px, transparent 1px),
        linear-gradient(90deg, #1c2028 1px, transparent 1px);

    background-size: 30px 30px;

    border: 1px solid #30343f;

    border-radius: 14px;

    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}

.editor-info {
    position: absolute;

    left: 12px;
    top: 12px;

    background: rgba(10,12,17,.9);

    padding: 10px;

    border-radius: 9px;

    pointer-events: none;

    font-size: 12px;
}

.editor-info strong {
    color: #ff3b3b;
}


/* =========================
   SETTINGS
========================= */

.settings {
    background: #181b23;

    border: 1px solid #30343f;

    border-radius: 14px;

    padding: 15px;

    margin-top: 12px;
}

.settings h2 {
    font-size: 17px;

    margin-bottom: 12px;
}

.setting {
    margin-bottom: 14px;
}

.setting-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 7px;
}

.setting label {
    color: #b4bac6;

    font-size: 13px;
}

.value {
    font-weight: bold;
}

.setting input[type="range"] {
    width: 100%;
}


/* =========================
   TRACK LIST
========================= */

.section-title {
    margin-top: 25px;

    margin-bottom: 10px;

    font-size: 20px;
}

.track-list {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 12px;
}

.track-card {
    background: #181b23;

    border: 1px solid #30343f;

    border-radius: 12px;

    padding: 15px;
}

.track-card h3 {
    margin-bottom: 7px;
}

.track-card p {
    color: #9da3b0;

    font-size: 13px;

    margin-bottom: 4px;
}

.track-actions {
    display: flex;

    gap: 7px;

    margin-top: 12px;
}

.track-actions button {
    flex: 1;

    border: none;

    border-radius: 7px;

    padding: 9px;

    color: white;

    background: #30343f;

    font-weight: bold;
}

.track-actions .open {
    background: #ff3030;
}

.track-actions .delete {
    background: #52272a;
}

.empty {
    background: #181b23;

    border: 1px dashed #3a3f4a;

    border-radius: 12px;

    padding: 25px;

    text-align: center;

    color: #8e94a1;
}


/* =========================
   MODAL
========================= */

.overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.72);

    z-index: 90;
}

.modal {
    display: none;

    position: fixed;

    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: calc(100% - 30px);

    max-width: 430px;

    background: #191c24;

    border: 1px solid #363b47;

    border-radius: 15px;

    padding: 20px;
}

.modal h2 {
    margin-bottom: 15px;
}

.input {
    width: 100%;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 8px;

    border: 1px solid #363b47;

    background: #0e1015;

    color: white;

    outline: none;
}

.modal-buttons {
    display: flex;

    gap: 8px;

    margin-top: 5px;
}

.modal-buttons button {
    flex: 1;

    padding: 12px;

    border: none;

    border-radius: 8px;

    font-weight: bold;
}

.cancel {
    background: #30343f;

    color: white;
}

.confirm {
    background: #ff3030;

    color: white;
}


/* =========================
   STATUS
========================= */

.status {
    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    background: #20242d;

    border: 1px solid #3a3f4a;

    padding: 10px 15px;

    border-radius: 20px;

    display: none;

    z-index: 200;

    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    .editor {
        height: 52vh;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        🏎️ Race <span>Star</span>
    </div>

    <div class="header-buttons">

        <button
            class="header-button"
            onclick="newCircuit()">

            ＋ Nieuw

        </button>

        <button
            class="header-button red"
            onclick="openSave()">

            💾 Opslaan

        </button>

    </div>

</header>


<div class="nav">

    <button
        id="editorTab"
        class="active"
        onclick="showEditor()">

        🛠️ Circuit Builder

    </button>

    <button
        id="tracksTab"
        onclick="showTracks()">

        🏁 Mijn circuits

    </button>

</div>


<main class="page">


<section id="editorPage">


    <div class="toolbar">


        <button
            id="drawTool"
            class="tool active"
            onclick="setMode('draw')">

            ✏️ Baan tekenen

        </button>


        <button
            id="startTool"
            class="tool"
            onclick="setMode('start')">

            🏁 Start/Finish

        </button>


        <button
            id="pitTool"
            class="tool"
            onclick="setMode('pit')">

            🔧 Pitstraat tekenen

        </button>


        <button
            class="tool"
            onclick="undoLast()">

            ↩️ Ongedaan

        </button>


        <button
            class="tool"
            onclick="clearTrack()">

            🗑 Wissen

        </button>

    </div>


    <div class="editor">

        <canvas id="canvas"></canvas>

        <div class="editor-info">

            <strong>CIRCUIT BUILDER</strong><br>

            Kies een tool en teken met je vinger.

        </div>

    </div>


    <div class="settings">

        <h2>
            ⚙️ Baaninstellingen
        </h2>


        <div class="setting">

            <div class="setting-top">

                <label>
                    Racebaan breedte
                </label>

                <div
                    class="value"
                    id="widthValue">

                    30

                </div>

            </div>

            <input
                id="widthRange"
                type="range"
                min="20"
                max="60"
                value="30"
                oninput="changeWidth()"
            >

        </div>


        <div class="setting">

            <div class="setting-top">

                <label>
                    Pitstraat breedte
                </label>

                <div
                    class="value"
                    id="pitWidthValue">

                    18

                </div>

            </div>

            <input
                id="pitWidthRange"
                type="range"
                min="10"
                max="40"
                value="18"
                oninput="changePitWidth()"
            >

        </div>

    </div>


    <h2 class="section-title">
        📋 Mijn circuits
    </h2>


    <div
        id="trackList">
    </div>


</section>


<section
    id="tracksPage"
    style="display:none;">

    <h2 class="section-title">
        🏁 Opgeslagen circuits
    </h2>

    <div
        id="allTracks">
    </div>

</section>


</main>


<div
    class="overlay"
    id="overlay"
    onclick="closeSave()">
</div>


<div
    class="modal"
    id="modal">

    <h2>
        🏁 Circuit opslaan
    </h2>


    <input
        id="trackName"
        class="input"
        placeholder="Circuitnaam"
    >


    <input
        id="trackCity"
        class="input"
        placeholder="Stad"
    >


    <input
        id="trackCountry"
        class="input"
        placeholder="Land"
    >


    <div class="modal-buttons">

        <button
            class="cancel"
            onclick="closeSave()">

            Annuleren

        </button>


        <button
            class="confirm"
            onclick="saveTrack()">

            Opslaan

        </button>

    </div>

</div>


<div
    class="status"
    id="status">
</div>


<script>


/* =========================
   VARIABLES
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let mode = "draw";

let drawing = false;

let trackPoints = [];

let pitPoints = [];

let startPoint = null;

let currentTrackId = null;

let trackWidth = 30;

let pitWidth = 18;


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    redraw();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   POSITION
========================= */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    let x;
    let y;


    if (event.touches) {

        x =
            event.touches[0].clientX
            - rect.left;

        y =
            event.touches[0].clientY
            - rect.top;

    } else {

        x =
            event.clientX
            - rect.left;

        y =
            event.clientY
            - rect.top;

    }


    return {
        x,
        y
    };

}


/* =========================
   START DRAW
========================= */

function startDrawing(event) {

    event.preventDefault();


    const pos =
        getPosition(event);


    /* RACEBAAN */

    if (
        mode === "draw"
    ) {

        drawing = true;

        trackPoints = [];

        trackPoints.push(pos);

        redraw();

        return;

    }


    /* PITSTRAAT */

    if (
        mode === "pit"
    ) {

        drawing = true;

        pitPoints = [];

        pitPoints.push(pos);

        redraw();

        return;

    }


    /* START */

    if (
        mode === "start"
    ) {

        startPoint =
            pos;

        redraw();

        showStatus(
            "🏁 Start/finish geplaatst"
        );

        return;

    }

}


/* =========================
   MOVE
========================= */

function draw(event) {

    if (!drawing) return;


    event.preventDefault();


    const pos =
        getPosition(event);


    let points;


    if (
        mode === "draw"
    ) {

        points =
            trackPoints;

    } else if (
        mode === "pit"
    ) {

        points =
            pitPoints;

    } else {

        return;

    }


    const last =
        points[
            points.length - 1
        ];


    if (!last) {

        points.push(pos);

        return;

    }


    const distance =
        Math.sqrt(

            Math.pow(
                pos.x - last.x,
                2
            )

            +

            Math.pow(
                pos.y - last.y,
                2
            )

        );


    if (
        distance > 5
    ) {

        points.push(pos);

        redraw();

    }

}


/* =========================
   STOP
========================= */

function stopDrawing() {

    drawing = false;

}


/* =========================
   REDRAW
========================= */

function redraw() {

    const rect =
        canvas.getBoundingClientRect();


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    /* RACEBAAN */

    if (
        trackPoints.length > 1
    ) {

        drawPath(
            trackPoints,
            "#07090d",
            trackWidth + 8
        );


        drawPath(
            trackPoints,
            "#555a64",
            trackWidth
        );


        drawCenterLine(
            trackPoints
        );

    }


    /* PITSTRAAT */

    if (
        pitPoints.length > 1
    ) {

        drawPath(
            pitPoints,
            "#07090d",
            pitWidth + 8
        );


        drawPath(
            pitPoints,
            "#414750",
            pitWidth
        );


        drawPitLine(
            pitPoints
        );

    }


    /* START */

    if (startPoint) {

        drawStartLine(
            startPoint
        );

    }

}


/* =========================
   PATH
========================= */

function drawPath(
    points,
    color,
    width
) {

    if (
        points.length < 2
    ) return;


    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.stroke();

}


/* =========================
   CENTER LINE
========================= */

function drawCenterLine(
    points
) {

    if (
        points.length < 2
    ) return;


    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;

    ctx.setLineDash([
        8,
        8
    ]);

    ctx.lineCap =
        "round";

    ctx.stroke();

    ctx.setLineDash([]);

}


/* =========================
   PIT LINE
========================= */

function drawPitLine(
    points
) {

    if (
        points.length < 2
    ) return;


    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }


    ctx.strokeStyle =
        "#f5c542";

    ctx.lineWidth =
        2;

    ctx.setLineDash([
        7,
        7
    ]);

    ctx.lineCap =
        "round";

    ctx.stroke();

    ctx.setLineDash([]);

}


/* =========================
   START FINISH
========================= */

function drawStartLine(
    point
) {

    const size = 25;


    ctx.save();


    for (
        let row = 0;
        row < 4;
        row++
    ) {

        for (
            let col = 0;
            col < 2;
            col++
        ) {

            ctx.fillStyle =
                (row + col) % 2 === 0
                ? "#ffffff"
                : "#111111";


            ctx.fillRect(

                point.x - size / 2
                + col * (size / 2),

                point.y - size / 2
                + row * (size / 4),

                size / 2,

                size / 4

            );

        }

    }


    ctx.restore();

}


/* =========================
   MODE
========================= */

function setMode(
    newMode
) {

    mode =
        newMode;


    document
        .querySelectorAll(".tool")
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    const ids = {

        draw:
            "drawTool",

        pit:
            "pitTool",

        start:
            "startTool"

    };


    if (
        ids[newMode]
    ) {

        document
            .getElementById(
                ids[newMode]
            )
            .classList.add(
                "active"
            );

    }


    if (
        newMode === "pit"
    ) {

        showStatus(
            "🔧 Teken nu je pitstraat"
        );

    }


    if (
        newMode === "draw"
    ) {

        showStatus(
            "✏️ Teken nu de racebaan"
        );

    }

}


/* =========================
   WIDTH
========================= */

function changeWidth() {

    trackWidth =
        Number(
            document
                .getElementById(
                    "widthRange"
                )
                .value
        );


    document
        .getElementById(
            "widthValue"
        )
        .textContent =
        trackWidth;


    redraw();

}


/* =========================
   PIT WIDTH
========================= */

function changePitWidth() {

    pitWidth =
        Number(
            document
                .getElementById(
                    "pitWidthRange"
                )
                .value
        );


    document
        .getElementById(
            "pitWidthValue"
        )
        .textContent =
        pitWidth;


    redraw();

}


/* =========================
   UNDO
========================= */

function undoLast() {

    if (
        mode === "pit"
    ) {

        if (
            pitPoints.length > 0
        ) {

            pitPoints.pop();

            redraw();

        }

        return;

    }


    if (
        trackPoints.length > 0
    ) {

        trackPoints.pop();

        redraw();

    }

}


/* =========================
   CLEAR
========================= */

function clearTrack() {

    trackPoints = [];

    pitPoints = [];

    startPoint = null;

    currentTrackId = null;

    redraw();

    showStatus(
        "🗑 Circuit gewist"
    );

}


/* =========================
   NEW
========================= */

function newCircuit() {

    clearTrack();

    document
        .getElementById(
            "trackName"
        )
        .value = "";


    document
        .getElementById(
            "trackCity"
        )
        .value = "";


    document
        .getElementById(
            "trackCountry"
        )
        .value = "";


    showEditor();

}


/* =========================
   SAVE MODAL
========================= */

function openSave() {

    if (
        trackPoints.length < 5
    ) {

        showStatus(
            "Teken eerst een racebaan."
        );

        return;

    }


    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "modal"
        )
        .style.display =
        "block";

}


function closeSave() {

    document
        .getElementById(
            "overlay"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "modal"
        )
        .style.display =
        "none";

}


/* =========================
   SAVE
========================= */

function saveTrack() {

    const name =
        document
            .getElementById(
                "trackName"
            )
            .value
            .trim();


    const city =
        document
            .getElementById(
                "trackCity"
            )
            .value
            .trim();


    const country =
        document
            .getElementById(
                "trackCountry"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Vul een circuitnaam in."
        );

        return;

    }


    let tracks =
        getTracks();


    const track = {

        id:
            currentTrackId ||
            Date.now(),

        name:
            name,

        city:
            city,

        country:
            country,

        points:
            trackPoints,

        pitPoints:
            pitPoints,

        start:
            startPoint,

        width:
            trackWidth,

        pitWidth:
            pitWidth

    };


    if (
        currentTrackId
    ) {

        const index =
            tracks.findIndex(
                t =>
                    t.id ===
                    currentTrackId
            );


        if (
            index !== -1
        ) {

            tracks[index] =
                track;

        }

    } else {

        tracks.push(
            track
        );

    }


    localStorage.setItem(
        "raceStarTracks",
        JSON.stringify(
            tracks
        )
    );


    currentTrackId =
        track.id;


    closeSave();

    renderTracks();

    showStatus(
        "✅ Circuit opgeslagen!"
    );

}


/* =========================
   GET TRACKS
========================= */

function getTracks() {

    return JSON.parse(
        localStorage.getItem(
            "raceStarTracks"
        )
    ) || [];

}


/* =========================
   RENDER TRACKS
========================= */

function renderTracks() {

    const tracks =
        getTracks();


    const list =
        document.getElementById(
            "trackList"
        );


    const all =
        document.getElementById(
            "allTracks"
        );


    if (
        tracks.length === 0
    ) {

        const empty = `
            <div class="empty">
                🏁 Nog geen circuits.
                <br><br>
                Maak je eerste circuit.
            </div>
        `;


        list.innerHTML =
            empty;

        all.innerHTML =
            empty;

        return;

    }


    const html =
        tracks.map(
            track => `

            <div class="track-card">

                <h3>
                    🏁 ${escapeHTML(track.name)}
                </h3>

                <p>
                    📍 ${escapeHTML(track.city || "Onbekend")}
                </p>

                <p>
                    🌍 ${escapeHTML(track.country || "Onbekend")}
                </p>

                <p>
                    🛣️ Racebaan:
                    ${track.points.length} punten
                </p>

                <p>
                    🔧 Pitstraat:
                    ${
                        track.pitPoints &&
                        track.pitPoints.length > 1
                        ? "Ja"
                        : "Nee"
                    }
                </p>

                <div class="track-actions">

                    <button
                        class="open"
                        onclick="openTrack(${track.id})">

                        Openen

                    </button>


                    <button
                        class="delete"
                        onclick="deleteTrack(${track.id})">

                        Verwijderen

                    </button>

                </div>

            </div>

        `
        ).join("");


    list.innerHTML =
        html;

    all.innerHTML =
        html;

}


/* =========================
   OPEN TRACK
========================= */

function openTrack(id) {

    const tracks =
        getTracks();


    const track =
        tracks.find(
            t =>
                t.id === id
        );


    if (!track) return;


    trackPoints =
        track.points || [];


    pitPoints =
        track.pitPoints || [];


    startPoint =
        track.start || null;


    currentTrackId =
        track.id;


    trackWidth =
        track.width || 30;


    pitWidth =
        track.pitWidth || 18;


    document
        .getElementById(
            "widthRange"
        )
        .value =
        trackWidth;


    document
        .getElementById(
            "widthValue"
        )
        .textContent =
        trackWidth;


    document
        .getElementById(
            "pitWidthRange"
        )
        .value =
        pitWidth;


    document
        .getElementById(
            "pitWidthValue"
        )
        .textContent =
        pitWidth;


    document
        .getElementById(
            "trackName"
        )
        .value =
        track.name || "";


    document
        .getElementById(
            "trackCity"
        )
        .value =
        track.city || "";


    document
        .getElementById(
            "trackCountry"
        )
        .value =
        track.country || "";


    showEditor();


    setTimeout(
        redraw,
        50
    );


    showStatus(
        "🏁 Circuit geopend"
    );

}


/* =========================
   DELETE
========================= */

function deleteTrack(id) {

    if (
        !confirm(
            "Circuit verwijderen?"
        )
    ) return;


    let tracks =
        getTracks();


    tracks =
        tracks.filter(
            track =>
                track.id !== id
        );


    localStorage.setItem(
        "raceStarTracks",
        JSON.stringify(
            tracks
        )
    );


    if (
        currentTrackId === id
    ) {

        clearTrack();

    }


    renderTracks();


    showStatus(
        "🗑 Circuit verwijderd"
    );

}


/* =========================
   TABS
========================= */

function showEditor() {

    document
        .getElementById(
            "editorPage"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tracksPage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "editorTab"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "tracksTab"
        )
        .classList.remove(
            "active"
        );


    setTimeout(
        resizeCanvas,
        50
    );

}


function showTracks() {

    document
        .getElementById(
            "editorPage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "tracksPage"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tracksTab"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "editorTab"
        )
        .classList.remove(
            "active"
        );


    renderTracks();

}


/* =========================
   STATUS
========================= */

function showStatus(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.style.display =
        "block";


    setTimeout(
        () => {

            status.style.display =
                "none";

        },
        2000
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    draw,
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    stopDrawing
);


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "mousedown",
    startDrawing
);


canvas.addEventListener(
    "mousemove",
    draw
);


canvas.addEventListener(
    "mouseup",
    stopDrawing
);


canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* =========================
   START
========================= */

resizeCanvas();

renderTracks();

</script>
