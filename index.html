<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Race Star - Circuit Editor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #101218;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 65px;
      background: #181b24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #303440;
    }

    header h1 {
      font-size: 20px;
    }

    header span {
      color: #ff3b3b;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      background: #ff3030;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .toolbar {
      height: 55px;
      background: #20232d;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      overflow-x: auto;
    }

    .toolbar button {
      background: #303441;
      white-space: nowrap;
    }

    .toolbar button.active {
      background: #ff3030;
    }

    #editor {
      position: relative;
      width: 100vw;
      height: calc(100vh - 120px);
      background:
        linear-gradient(#20242d 1px, transparent 1px),
        linear-gradient(90deg, #20242d 1px, transparent 1px);
      background-size: 30px 30px;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .info {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 17, 23, 0.9);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      pointer-events: none;
    }

    .info strong {
      color: #ff4040;
    }
  </style>
</head>

<body>

<header>
  <h1>🏎️ Race <span>Star</span></h1>
  <button onclick="clearTrack()">🗑 Wissen</button>
</header>

<div class="toolbar">
  <button id="drawBtn" class="active" onclick="setMode('draw')">
    ✏️ Baan tekenen
  </button>

  <button onclick="setMode('start')">
    🏁 Start
  </button>

  <button onclick="setMode('pit')">
    🔧 Pitstraat
  </button>
</div>

<div id="editor">

  <canvas id="trackCanvas"></canvas>

  <div class="info">
    <strong>Circuit Editor</strong><br>
    Teken met je vinger je circuit
  </div>

</div>

<script>

const canvas = document.getElementById("trackCanvas");
const ctx = canvas.getContext("2d");

let mode = "draw";
let drawing = false;

let trackPoints = [];
let startPoint = null;
let pitPoint = null;


// Canvas goed instellen
function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();

  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.scale(dpr, dpr);

  redraw();
}

window.addEventListener("resize", resizeCanvas);


// Positie van vinger/muis bepalen
function getPosition(event) {

  const rect = canvas.getBoundingClientRect();

  let x;
  let y;

  if (event.touches) {

    x = event.touches[0].clientX - rect.left;
    y = event.touches[0].clientY - rect.top;

  } else {

    x = event.clientX - rect.left;
    y = event.clientY - rect.top;

  }

  return { x, y };
}


// Tekenen starten
function startDrawing(event) {

  event.preventDefault();

  const pos = getPosition(event);

  if (mode === "draw") {

    drawing = true;

    trackPoints = [];

    trackPoints.push(pos);

    redraw();

  }

  else if (mode === "start") {

    startPoint = pos;

    redraw();

  }

  else if (mode === "pit") {

    pitPoint = pos;

    redraw();

  }
}


// Tijdens tekenen
function draw(event) {

  if (!drawing || mode !== "draw") return;

  event.preventDefault();

  const pos = getPosition(event);

  trackPoints.push(pos);

  redraw();
}


// Tekenen stoppen
function stopDrawing() {

  drawing = false;

}


// Alles tekenen
function redraw() {

  const rect = canvas.getBoundingClientRect();

  ctx.clearRect(0, 0, rect.width, rect.height);


  // CIRCUIT

  if (trackPoints.length > 1) {

    // Buitenste donkere baan
    ctx.beginPath();

    ctx.moveTo(
      trackPoints[0].x,
      trackPoints[0].y
    );

    for (let i = 1; i < trackPoints.length; i++) {

      ctx.lineTo(
        trackPoints[i].x,
        trackPoints[i].y
      );

    }

    ctx.strokeStyle = "#08090c";
    ctx.lineWidth = 32;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();


    // Asfalt
    ctx.beginPath();

    ctx.moveTo(
      trackPoints[0].x,
      trackPoints[0].y
    );

    for (let i = 1; i < trackPoints.length; i++) {

      ctx.lineTo(
        trackPoints[i].x,
        trackPoints[i].y
      );

    }

    ctx.strokeStyle = "#555a64";
    ctx.lineWidth = 26;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();


    // Middenlijn
    ctx.beginPath();

    ctx.moveTo(
      trackPoints[0].x,
      trackPoints[0].y
    );

    for (let i = 1; i < trackPoints.length; i++) {

      ctx.lineTo(
        trackPoints[i].x,
        trackPoints[i].y
      );

    }

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.stroke();

    ctx.setLineDash([]);

  }


  // START
  if (startPoint) {

    ctx.beginPath();

    ctx.arc(
      startPoint.x,
      startPoint.y,
      15,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#22c55e";
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "🏁",
      startPoint.x,
      startPoint.y
    );

  }


  // PIT
  if (pitPoint) {

    ctx.beginPath();

    ctx.arc(
      pitPoint.x,
      pitPoint.y,
      15,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#3b82f6";
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "🔧",
      pitPoint.x,
      pitPoint.y
    );

  }

}


// Mode veranderen
function setMode(newMode) {

  mode = newMode;

  document
    .querySelectorAll(".toolbar button")
    .forEach(button => {
      button.classList.remove("active");
    });

  if (newMode === "draw") {

    document
      .getElementById("drawBtn")
      .classList.add("active");

  }
}


// Alles wissen
function clearTrack() {

  trackPoints = [];

  startPoint = null;

  pitPoint = null;

  redraw();
}


// Touch events
canvas.addEventListener(
  "touchstart",
  startDrawing,
  { passive: false }
);

canvas.addEventListener(
  "touchmove",
  draw,
  { passive: false }
);

canvas.addEventListener(
  "touchend",
  stopDrawing
);


// Muis events
canvas.addEventListener(
  "mousedown",
  startDrawing
);

canvas.addEventListener(
  "mousemove",
  draw
);

canvas.addEventListener(
  "mouseup",
  stopDrawing
);

canvas.addEventListener(
  "mouseleave",
  stopDrawing
);


// Start
resizeCanvas();

</script>

</body>
</html>
